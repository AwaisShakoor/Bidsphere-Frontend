name: Deploy Audit

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: deploy-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-audit:
    name: Deploy Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit:check

      - name: Production build
        run: npm run build
